name: forrest
description: Aplikasi fokus anti-distraksi dengan hutan virtual untuk mahasiswa dan pelajar.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # State Management
  provider: ^6.1.2

  # Auth
  google_sign_in: ^6.2.1

  # UI & Charts
  fl_chart: ^0.68.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Utils
  shared_preferences: ^2.3.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  # Semua pohon digambar via CustomPainter — tidak ada file aset
